services:
  server:
    build: .
    container_name: jira-app
    expose:
      - '8080'
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db-postgres:5432/jira
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - jira-network

  db-postgres:
    image: postgres:latest
    container_name: db-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: JiraRush
      POSTGRES_DB: jira
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jira -d jira" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jira-network

  nginx:
    image: nginx:1.23-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./resources:/opt/jirarush/resources
    depends_on:
      - server
    networks:
      - jira-network

networks:
  jira-network:
    driver: bridge